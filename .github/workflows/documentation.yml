name: Keep release documentation on the main README

on:
  push:
    branches: [main]
    paths:
      - README.md
      - packaging/build_release.py
      - .github/workflows/documentation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-readme-assets:
    if: github.repository == 'Aftonstjarna/ReRiff'
    runs-on: ubuntu-latest
    steps:
      - name: Remove standalone README downloads from existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | .assets[] | select(.name | test("^README([._-].*)?$"; "i")) | .id' |
          while read -r asset_id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done
