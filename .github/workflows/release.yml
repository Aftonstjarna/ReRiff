name: Build and publish client release

on:
  push:
    branches: [main, launcher]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Aftonstjarna/ReRiff'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Verify release version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; bump VERSION instead of replacing it."
            exit 1
          fi
      - name: Fetch verified compiler and Windows Python
        run: python packaging/fetch_release_tools.py --directory "$RUNNER_TEMP/release-tools"
      - name: Fetch pinned offline server dependencies
        run: >-
          python -m pip download --dest "$RUNNER_TEMP/wheels"
          --only-binary=:all: --platform win_amd64 --python-version 313
          --implementation cp --abi cp313 -r packaging/requirements.txt
      - name: Build client helper
        run: dotnet build ClientConfig/ClientConfig.csproj -c Release -o build
      - name: Build native launcher, notification, and Windows setup
        run: python scripts/build-windows-launcher.py --zig "$RUNNER_TEMP/release-tools/zig-x86_64-linux-0.14.1/zig"
      - name: Build Linux and Windows server identity libraries
        # Native catalog matches the platform running Python, not the x86 game.
        # Portable Windows Python and supported Linux release targets are x64.
        run: >-
          python scripts/build-song-catalog.py
          --zig "$RUNNER_TEMP/release-tools/zig-x86_64-linux-0.14.1/zig"
      - name: Package Windows and Linux installers
        run: >-
          python packaging/build_release.py --update-only
          --wheels-dir "$RUNNER_TEMP/wheels"
          --python-zip "$RUNNER_TEMP/release-tools/python.zip"
      - name: Verify installer safety and rollback
        env:
          RERIFF_SYNTHETIC_TESTS: '1'
        run: python -m unittest discover -s packaging -p test_installer.py -v
      - name: Verify automatic update extraction and rollback
        run: python scripts/test_client_update.py
      - name: Validate Linux self-extractor
        run: sh "dist/v$(cat VERSION)/ReRiff-$(cat VERSION)-linux.run" --help
      - name: Verify published archive checksums
        run: cd "dist/v$(cat VERSION)" && sha256sum -c SHA256SUMS
      - name: Publish GitHub release and installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          python packaging/release_notes.py --version "$version" --output "$RUNNER_TEMP/RELEASE-NOTES.md"
          gh release create "v$version" \
            --target "$GITHUB_SHA" \
            --title "ReRiff $version" \
            --notes-file "$RUNNER_TEMP/RELEASE-NOTES.md" \
            "dist/v$version/"*
