name: reriff
services:
  server:
    image: "${RERIFF_IMAGE:-ghcr.io/aftonstjarna/reriff:latest}"
    ports:
      - "${RERIFF_BIND_ADDRESS:-127.0.0.1}:${RERIFF_PORT:-5144}:5144"
    volumes:
      - reriff-data:/data
    environment:
      RERIFF_SERVER_PASSWORD: "${RERIFF_SERVER_PASSWORD:-}"
      RERIFF_PROGRESSION_MODE: "${RERIFF_PROGRESSION_MODE:-disabled}"
      RERIFF_PUBLIC_URL: "${RERIFF_PUBLIC_URL:-}"
      RERIFF_LAN_URL: "${RERIFF_LAN_URL:-}"
      # Pass through balance settings from .env or the shell; absent keys use image defaults.
      RERIFF_BALANCE_COIN_REWARD_RATE:
      RERIFF_BALANCE_CREATOR_REWARD_RATE:
      RERIFF_BALANCE_PRESTIGE_MULTIPLIER_GROWTH:
      RERIFF_BALANCE_PRESTIGE_MULTIPLIER_CAP:
      RERIFF_BALANCE_PAINT_PRICE_SCALE:
      RERIFF_BALANCE_DISCOUNT_MODE:
      RERIFF_BALANCE_DISCOUNT_START_LEVEL:
      RERIFF_BALANCE_DISCOUNT_START:
      RERIFF_BALANCE_DISCOUNT_INTERVAL:
      RERIFF_BALANCE_DISCOUNT_INCREASE:
      RERIFF_BALANCE_DISCOUNT_MAXIMUM:
      RERIFF_BALANCE_DISCOUNT_LEVEL_10:
      RERIFF_BALANCE_DISCOUNT_LEVEL_20:
      RERIFF_BALANCE_DISCOUNT_LEVEL_30:
      RERIFF_BALANCE_DISCOUNT_REMAINING_GAP_FACTOR:
      RERIFF_BALANCE_MAIN_LEVEL_CAP:
      RERIFF_BALANCE_MAIN_LEVEL_XP_STEP:
      RERIFF_BALANCE_MAIN_LEVEL_XP_GROWTH:
      RERIFF_BALANCE_MAIN_XP_RATE:
      RERIFF_BALANCE_PRESTIGE_XP_RATE:
      RERIFF_BALANCE_SEASON:
      RERIFF_BALANCE_ANTI_CHEAT:
      RERIFF_BALANCE_CAR_LEVELS:
      RERIFF_BALANCE_REQUIRED_ACHIEVEMENTS:
      RERIFF_BALANCE_MAXIMUM_PRESTIGE_COUNT:
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  reriff-data:
